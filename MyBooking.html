<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Réservations - SpaceVoyager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Reprendre les styles de booking.html */
        body {
            background-color: #0A192F;
            color: #CCD6F6;
            font-family: 'Exo 2', sans-serif;
        }
        .booking-card {
            background: rgba(22, 33, 62, 0.7);
            border: 1px solid rgba(14, 165, 233, 0.3);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .status-confirmed {
            color: #10b981;
        }
        .status-pending {
            color: #f59e0b;
        }
        .status-cancelled {
            color: #ef4444;
        }
    </style>
</head>
<body class="min-h-screen">
    <header class="header" style="background-color: #000; padding: 1rem 5%;">
        <div class="logo">
            <img src="images/LOGOSF.png" alt="Logo SpaceVoyager" style="width: 300px; height: 60px; object-fit: contain;">
        </div>
        <nav class="main-nav">
            <ul style="list-style: none; display: flex; gap: 2rem;">
                <li><a href="index.html">Home</a></li>
                <li><a href="destinations.html">Destinations</a></li>
                <li><a href="booking.html">Booking</a></li>
                <li><a href="about.html">À Propos</a></li>
                <li><a href="my-bookings.html" style="color: #00bcd4;">My Booking</a></li>
            </ul>
        </nav>
    </header>

    <main class="container mx-auto px-4 py-12">
        <h1 class="font-orbitron text-4xl mb-8 text-center">Mes Réservations</h1>
        
        <div id="bookings-container">
            <!-- Les réservations seront chargées ici -->
        </div>

        <div id="no-bookings" class="text-center py-12 hidden">
            <i class="fas fa-rocket text-6xl text-gray-500 mb-4"></i>
            <h2 class="text-2xl mb-4">Aucune réservation trouvée</h2>
            <p class="text-gray-400 mb-6">Vous n'avez pas encore de réservation. Commencez votre aventure spatiale !</p>
            <a href="booking.html" class="btn-primary text-white px-6 py-3 rounded-lg font-bold">
                <i class="fas fa-plus mr-2"></i>Réserver un voyage
            </a>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadUserBookings();
        });

        function loadUserBookings() {
            const bookings = JSON.parse(localStorage.getItem('userBookings') || '[]');
            const container = document.getElementById('bookings-container');
            const noBookings = document.getElementById('no-bookings');
            
            if (bookings.length === 0) {
                container.innerHTML = '';
                noBookings.classList.remove('hidden');
                return;
            }
            
            noBookings.classList.add('hidden');
            container.innerHTML = '';
            
            // Trier les réservations par date de création (plus récentes en premier)
            bookings.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            
            bookings.forEach(booking => {
                const bookingElement = document.createElement('div');
                bookingElement.className = 'booking-card';
                bookingElement.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="font-orbitron text-xl text-neon-blue">${booking.destination.name}</h3>
                            <p class="text-gray-400">${booking.package.name} • ${booking.tripDuration} jours</p>
                        </div>
                        <div class="text-right">
                            <span class="status-${booking.status} font-bold">${getStatusText(booking.status)}</span>
                            <p class="text-sm text-gray-400">${new Date(booking.createdAt).toLocaleDateString('fr-FR')}</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <p><strong>Date de départ:</strong> ${new Date(booking.departureDate).toLocaleDateString('fr-FR')}</p>
                            <p><strong>Passagers:</strong> ${booking.passengers.length}</p>
                        </div>
                        <div>
                            <p><strong>Total:</strong> ${booking.totalPrice.toLocaleString()} €</p>
                            <p><strong>Référence:</strong> ${booking.id}</p>
                        </div>
                    </div>
                    
                    <div class="flex gap-2 mt-4">
                        <button onclick="viewBookingDetails('${booking.id}')" class="btn-secondary text-white px-4 py-2 rounded text-sm">
                            <i class="fas fa-eye mr-1"></i>Détails
                        </button>
                        <button onclick="cancelBooking('${booking.id}')" class="bg-red-500 text-white px-4 py-2 rounded text-sm">
                            <i class="fas fa-times mr-1"></i>Annuler
                        </button>
                    </div>
                `;
                container.appendChild(bookingElement);
            });
        }

        function getStatusText(status) {
            const statusMap = {
                'confirmed': 'Confirmée',
                'pending': 'En attente',
                'cancelled': 'Annulée'
            };
            return statusMap[status] || status;
        }

        function viewBookingDetails(bookingId) {
            // Rediriger vers une page de détails ou afficher un modal
            alert(`Détails de la réservation: ${bookingId}`);
        }

        function cancelBooking(bookingId) {
            if (confirm('Êtes-vous sûr de vouloir annuler cette réservation ?')) {
                let bookings = JSON.parse(localStorage.getItem('userBookings') || '[]');
                bookings = bookings.map(booking => {
                    if (booking.id === bookingId) {
                        return { ...booking, status: 'cancelled' };
                    }
                    return booking;
                });
                localStorage.setItem('userBookings', JSON.stringify(bookings));
                loadUserBookings();
                alert('Réservation annulée avec succès');
            }
        }
    </script>
</body>
</html>
