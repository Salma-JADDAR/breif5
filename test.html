<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Background</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .hero-section {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      text-align: center;
      background-size: cover;
      background-position: center;
      transition: background-image 1s ease-in-out;
      background-image: url("https://images.unsplash.com/photo-1587474260584-136574528ed5");
    }

    .hero-section h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .hero-section p {
      font-size: 1.2rem;
      max-width: 600px;
    }

    .buttons {
      margin-top: 2rem;
    }

    .buttons button {
      padding: 10px 20px;
      margin: 0 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      background: rgba(255,255,255,0.8);
      color: #333;
      transition: 0.3s;
    }

    .buttons button:hover {
      background: white;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <section class="hero-section">
    <h1>Explore Beyond Earth</h1>
    <p>Découvrez l’univers à travers nos voyages interstellaires vers des destinations incroyables.</p>
    <div class="buttons">
      <button>Book Now</button>
      <button>View Destinations</button>
    </div>
  </section>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const images = [
        "https://images.unsplash.com/photo-1587474260584-136574528ed5",
        "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa",
        "https://images.unsplash.com/photo-1476610182048-b716b8518aae"
      ];

      let current = 0;
      const hero = document.querySelector(".hero-section");

      function changeBackground() {
        hero.style.backgroundImage = `url(${images[current]})`;
        current = (current + 1) % images.length;
      }

      setInterval(changeBackground, 3000);
      changeBackground();
    });
  </script>

</body>
</html>
